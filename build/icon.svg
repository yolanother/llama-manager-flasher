  Llama Manager Flasher app icon (source SVG). A rounded-square badge filled
  with the brand AMD red-to-ember gradient carries a minimal white llama-head
  glyph, with a small emerald node marking the "signed & verified" motif.
  scripts/gen-icons.mjs rasterizes this file into build/icon.png / icon.ico /
  icon.icns for electron-builder; the same mark is reproduced inline by the
  renderer's LlamaMark component.
-->
