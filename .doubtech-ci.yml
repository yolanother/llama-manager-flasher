# Copyright (c) 2026 Doubling Technologies. Use of this file is governed by
# the LICENSE file in the repository root.
#
# Runs on every push to main across linux / mac / windows nodes. Phases are
# thin wrappers over the ci/ scripts so a developer can reproduce any phase
# locally with the same command. The test phase writes a JUnit XML report
# that DoubTech CI aggregates via testReports; the package phase emits
# exactly one versionless installer per platform into dist-installer/
# (LlamaManagerFlasher-win-x64-portable.exe / -mac-universal.dmg /
# -linux-x86_64.AppImage) — the marketing site hard-links those names.
version: 1
name: llama-manager-flasher
platforms: [linux, mac, windows]
branches: [main]
testReports: ["reports/junit/*.xml"]
test:
  - run: pnpm install --frozen-lockfile
  - run: pnpm test:ci
build:
  - run: node ci/build.mjs
package:
  - run: node ci/package.mjs
    timeoutSeconds: 3600
    artifacts: [dist-installer/LlamaManagerFlasher-*]
