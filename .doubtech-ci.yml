# the LICENSE file in the repository root.
#
# Runs on every push to main across linux / mac / windows nodes. Phases are
# thin wrappers over the ci/ scripts so a developer can reproduce any phase
# locally with the same command. Installs are PHASE-SCOPED: the test and
# build phases install with --ignore-scripts because vitest / tsc / vite are
# pure TypeScript and need no native modules — this keeps those phases green
# on nodes without a C/C++ toolchain (Windows nodes without VS Build Tools,
# macs without Xcode CLT). Only the package phase runs the full scripted
# install (native gyp builds + electron), gated by ci/preflight.mjs which
# verifies — and best-effort installs — the node's toolchain first.
# The test phase writes a JUnit XML report that DoubTech CI aggregates via
# testReports; the package phase emits exactly one versionless installer per
# platform into dist-installer/ (LlamaManagerFlasher-win-x64-portable.exe /
# -mac-universal.dmg / -linux-x86_64.AppImage) — the marketing site
# hard-links those names.
version: 1
name: llama-manager-flasher
platforms: [linux, mac, windows]
branches: [main]
testReports: ["reports/junit/*.xml"]
test:
  - run: pnpm install --frozen-lockfile --ignore-scripts
  - run: pnpm test:ci
build:
  - run: node ci/build.mjs
package:
  - run: node ci/preflight.mjs
  - run: node ci/package.mjs
    timeoutSeconds: 3600
    artifacts: [dist-installer/LlamaManagerFlasher-*]
